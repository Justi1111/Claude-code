<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Top-Down Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const STATES = { START: 'start', PLAYING: 'playing', DEAD: 'dead' };
    let state = STATES.START;

    const WORLD_W = 4000;
    const WORLD_H = 4000;
    const TILE_SIZE = 64;

    let player, bullets, enemies, score, lives, spawnTimer, spawnInterval, camera;

    function initGame() {
        player = {
            x: WORLD_W / 2,
            y: WORLD_H / 2,
            radius: 18,
            speed: 4,
            angle: 0,
            shootCooldown: 0,
            shootRate: 15,
            invincible: 0
        };
        camera = {
            x: WORLD_W / 2 - canvas.width / 2,
            y: WORLD_H / 2 - canvas.height / 2
        };
        bullets = [];
        enemies = [];
        score = 0;
        lives = 3;
        spawnTimer = 0;
        spawnInterval = 120;
        state = STATES.PLAYING;
    }

    // Touch controls
    let joystick = { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 };
    let shootBtn = { active: false, id: null };
    const JOYSTICK_RADIUS = 60;
    const SHOOT_BTN_RADIUS = 45;

    function getShootBtnPos() {
        return { x: canvas.width - 90, y: canvas.height - 90 };
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state !== STATES.PLAYING) { initGame(); return; }
        for (let touch of e.changedTouches) {
            const btn = getShootBtnPos();
            if (Math.hypot(touch.clientX - btn.x, touch.clientY - btn.y) < SHOOT_BTN_RADIUS + 30) {
                shootBtn.active = true;
                shootBtn.id = touch.identifier;
            } else if (!joystick.active) {
                joystick.active = true;
                joystick.id = touch.identifier;
                joystick.startX = touch.clientX;
                joystick.startY = touch.clientY;
                joystick.dx = 0;
                joystick.dy = 0;
            }
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystick.id) {
                joystick.dx = touch.clientX - joystick.startX;
                joystick.dy = touch.clientY - joystick.startY;
                const len = Math.hypot(joystick.dx, joystick.dy);
                if (len > JOYSTICK_RADIUS) {
                    joystick.dx = (joystick.dx / len) * JOYSTICK_RADIUS;
                    joystick.dy = (joystick.dy / len) * JOYSTICK_RADIUS;
                }
            }
        }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystick.id) {
                joystick.active = false;
                joystick.dx = 0;
                joystick.dy = 0;
            }
            if (touch.identifier === shootBtn.id) {
                shootBtn.active = false;
            }
        }
    }, { passive: false });

    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if ((e.key === ' ' || e.key === 'Enter') && state !== STATES.PLAYING) initGame();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    canvas.addEventListener('click', () => { if (state !== STATES.PLAYING) initGame(); });

    function spawnEnemy() {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(canvas.width, canvas.height) * 0.65;
        const x = Math.max(20, Math.min(WORLD_W - 20, player.x + Math.cos(angle) * dist));
        const y = Math.max(20, Math.min(WORLD_H - 20, player.y + Math.sin(angle) * dist));
        enemies.push({ x, y, radius: 14, speed: 1.2 + Math.random() * 1.8, hp: 1 });
    }

    function shoot() {
        if (player.shootCooldown > 0) return;
        player.shootCooldown = player.shootRate;
        bullets.push({
            x: player.x + Math.cos(player.angle) * player.radius,
            y: player.y + Math.sin(player.angle) * player.radius,
            dx: Math.cos(player.angle) * 9,
            dy: Math.sin(player.angle) * 9,
            radius: 5,
            life: 110
        });
    }

    function update() {
        if (state !== STATES.PLAYING) return;

        let moveX = 0, moveY = 0;
        if (keys['ArrowUp'] || keys['w']) moveY -= 1;
        if (keys['ArrowDown'] || keys['s']) moveY += 1;
        if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
        if (keys['ArrowRight'] || keys['d']) moveX += 1;

        if (joystick.active || joystick.dx !== 0 || joystick.dy !== 0) {
            moveX = joystick.dx / JOYSTICK_RADIUS;
            moveY = joystick.dy / JOYSTICK_RADIUS;
        }

        const moveLen = Math.hypot(moveX, moveY);
        if (moveLen > 0) {
            player.x += (moveX / moveLen) * player.speed;
            player.y += (moveY / moveLen) * player.speed;
        }

        // Auto-aim at nearest enemy
        if (enemies.length > 0) {
            let nearest = null, nearestDist = Infinity;
            for (let e of enemies) {
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < nearestDist) { nearestDist = d; nearest = e; }
            }
            if (nearest) player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        }

        player.x = Math.max(player.radius, Math.min(WORLD_W - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(WORLD_H - player.radius, player.y));

        // Camera follows player
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
        camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
        camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));

        if (keys[' '] || keys['z'] || shootBtn.active) shoot();
        if (player.shootCooldown > 0) player.shootCooldown--;
        if (player.invincible > 0) player.invincible--;

        bullets = bullets.filter(b => b.life > 0);
        for (let b of bullets) { b.x += b.dx; b.y += b.dy; b.life--; }

        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            spawnEnemy();
            if (score > 5) spawnEnemy();
            if (score > 15) spawnEnemy();
            if (spawnInterval > 40) spawnInterval -= 1;
        }

        for (let e of enemies) {
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const len = Math.hypot(dx, dy);
            e.x += (dx / len) * e.speed;
            e.y += (dy / len) * e.speed;
        }

        for (let b of bullets) {
            for (let e of enemies) {
                if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                    b.life = 0;
                    e.hp--;
                    if (e.hp <= 0) score++;
                }
            }
        }
        enemies = enemies.filter(e => e.hp > 0);

        if (player.invincible === 0) {
            for (let e of enemies) {
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius - 4) {
                    lives--;
                    player.invincible = 90;
                    enemies = enemies.filter(en => en !== e);
                    if (lives <= 0) state = STATES.DEAD;
                    break;
                }
            }
        }
    }

    // World to screen
    function ws(x, y) {
        return { x: x - camera.x, y: y - camera.y };
    }

    function drawFloor() {
        const startTX = Math.floor(camera.x / TILE_SIZE) - 1;
        const startTY = Math.floor(camera.y / TILE_SIZE) - 1;
        const endTX = Math.ceil((camera.x + canvas.width) / TILE_SIZE) + 1;
        const endTY = Math.ceil((camera.y + canvas.height) / TILE_SIZE) + 1;

        for (let tx = startTX; tx <= endTX; tx++) {
            for (let ty = startTY; ty <= endTY; ty++) {
                const sx = Math.floor(tx * TILE_SIZE - camera.x);
                const sy = Math.floor(ty * TILE_SIZE - camera.y);

                // Consistent per-tile color variation
                const h = Math.abs((tx * 73856093) ^ (ty * 19349663)) % 1000;
                const v = 20 + Math.floor(h / 1000 * 16);
                ctx.fillStyle = `rgb(${v + 3},${v + 1},${v + 6})`;
                ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);

                // Grout lines
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(sx, sy, TILE_SIZE, 2);
                ctx.fillRect(sx, sy, 2, TILE_SIZE);

                // Rare highlight tile
                if (h < 60) {
                    ctx.fillStyle = 'rgba(255,255,255,0.03)';
                    ctx.fillRect(sx + 3, sy + 3, TILE_SIZE - 6, TILE_SIZE - 6);
                }
            }
        }
    }

    function drawHeart(x, y, size, filled) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        ctx.moveTo(0, size * 0.3);
        ctx.bezierCurveTo(-size * 0.5, -size * 0.3, -size, size * 0.1, 0, size);
        ctx.bezierCurveTo(size, size * 0.1, size * 0.5, -size * 0.3, 0, size * 0.3);
        ctx.fillStyle = filled ? '#ff4444' : '#333';
        ctx.fill();
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (state === STATES.START) {
            camera = { x: 0, y: 0 };
            drawFloor();
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4fc3f7';
            ctx.font = 'bold 38px monospace';
            ctx.fillText('TOP-DOWN SHOOTER', canvas.width / 2, canvas.height / 2 - 50);
            ctx.fillStyle = '#aaa';
            ctx.font = '20px monospace';
            ctx.fillText('Tap or press Enter to start', canvas.width / 2, canvas.height / 2 + 10);
            ctx.font = '16px monospace';
            ctx.fillStyle = '#666';
            ctx.fillText('Move: WASD / Left joystick', canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('Shoot: SPACE / FIRE button', canvas.width / 2, canvas.height / 2 + 78);
            return;
        }

        drawFloor();

        // Bullets
        for (let b of bullets) {
            const s = ws(b.x, b.y);
            ctx.beginPath();
            ctx.arc(s.x, s.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe066';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffe066';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Enemies
        for (let e of enemies) {
            const s = ws(e.x, e.y);
            ctx.beginPath();
            ctx.arc(s.x, s.y, e.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff0000';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s.x - 4, s.y - 3, 3, 0, Math.PI * 2);
            ctx.arc(s.x + 4, s.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(s.x - 4, s.y - 3, 1.5, 0, Math.PI * 2);
            ctx.arc(s.x + 4, s.y - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Player
        const ps = ws(player.x, player.y);
        const alpha = player.invincible > 0 ? (Math.floor(player.invincible / 5) % 2 === 0 ? 0.3 : 1) : 1;
        ctx.globalAlpha = alpha;
        ctx.save();
        ctx.translate(ps.x, ps.y);
        ctx.rotate(player.angle);
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#4fc3f7';
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#4fc3f7';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#81d4fa';
        ctx.fillRect(2, -5, player.radius + 6, 10);
        ctx.restore();
        ctx.globalAlpha = 1;

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 16, 36);
        for (let i = 0; i < 3; i++) {
            drawHeart(canvas.width - 28 - i * 36, 16, 10, i < lives);
        }

        // Joystick
        const jbase = joystick.active
            ? { x: joystick.startX, y: joystick.startY }
            : { x: 90, y: canvas.height - 90 };
        ctx.beginPath();
        ctx.arc(jbase.x, jbase.y, JOYSTICK_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(jbase.x + joystick.dx, jbase.y + joystick.dy, 26, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fill();

        // Fire button
        const btn = getShootBtnPos();
        ctx.beginPath();
        ctx.arc(btn.x, btn.y, SHOOT_BTN_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = shootBtn.active ? 'rgba(255,200,0,0.55)' : 'rgba(255,200,0,0.18)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,200,0,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ffe066';
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FIRE', btn.x, btn.y + 5);

        // Game over
        if (state === STATES.DEAD) {
            ctx.fillStyle = 'rgba(0,0,0,0.72)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 48px monospace';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
            ctx.fillStyle = '#fff';
            ctx.font = '28px monospace';
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);
            ctx.fillStyle = '#aaa';
            ctx.font = '20px monospace';
            ctx.fillText('Tap to restart', canvas.width / 2, canvas.height / 2 + 55);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
