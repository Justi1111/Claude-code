<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Top-Down Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; touch-action: none; font-family: monospace; }
        canvas { display: block; }

        #debug-toggle {
            position: fixed; top: 10px; right: 10px;
            background: rgba(60,60,80,0.9); color: #aaa;
            border: 1px solid #555; padding: 5px 10px;
            font-family: monospace; font-size: 12px;
            cursor: pointer; z-index: 200; border-radius: 4px;
            user-select: none;
        }
        #debug-toggle:active { background: rgba(90,90,110,0.9); }
        #debug-panel {
            display: none;
            position: fixed; top: 42px; right: 10px;
            background: rgba(8,8,20,0.96); color: #ccc;
            padding: 14px; border: 1px solid #444;
            z-index: 199; min-width: 240px; border-radius: 6px;
        }
        #debug-panel h3 { color: #4fc3f7; margin-bottom: 12px; font-size: 13px; letter-spacing: 1px; }
        .drow { margin-bottom: 12px; }
        .drow .dlabel { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 3px; }
        .drow input[type=range] { width: 100%; cursor: pointer; accent-color: #4fc3f7; }
        .drow.checkbox { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .drow.checkbox input { width: 15px; height: 15px; cursor: pointer; accent-color: #ffd700; }
        .dbtn { background: rgba(60,60,80,0.9); color: #ccc; border: 1px solid #555;
                padding: 5px 10px; font-family: monospace; font-size: 12px; cursor: pointer;
                border-radius: 4px; }
        .dbtn:active { background: rgba(90,90,120,0.9); }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<button id="debug-toggle">DEBUG</button>
<div id="debug-panel">
    <h3>&#9881; DEBUG PANEL</h3>
    <div class="drow">
        <div class="dlabel"><span>Zoom (Field of View)</span><span id="zoom-val">0.6</span></div>
        <input type="range" id="zoom-slider" min="0.25" max="1.2" step="0.05" value="0.6">
    </div>
    <div class="drow">
        <div class="dlabel"><span>Fire Rate override (lower = faster)</span><span id="fr-val">off</span></div>
        <input type="range" id="fr-slider" min="2" max="49" step="1" value="49">
    </div>
    <div class="drow checkbox">
        <input type="checkbox" id="godmode">
        <label for="godmode">God Mode (Invincible)</label>
    </div>
    <div class="drow" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="dbtn" id="btn-levelup">+1 Level</button>
        <button class="dbtn" id="btn-wave">Spawn Wave</button>
        <button class="dbtn" id="btn-killall">Kill All</button>
    </div>
    <div class="drow" style="font-size:12px;color:#aaa;">
        Enemies: <span id="enemy-count">0</span>
    </div>
</div>

<script src="game.js"></script>
<script src="render.js"></script>
</body>
</html>
