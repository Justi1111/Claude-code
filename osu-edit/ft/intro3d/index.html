<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Lilita'; src: url('fonts/LilitaOne.woff2') format('woff2'); }
@font-face { font-family: 'KR'; src: url('fonts/NotoKR.woff2') format('woff2'); }
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
#wrap { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
#wrap canvas { display: block; position: absolute; left: 0; top: 0; }
.txt {
  position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0;
  font-family: 'Lilita', sans-serif; color: #fff; line-height: 1;
  paint-order: stroke fill; -webkit-text-stroke: 16px #15121a;
  text-shadow: 0 9px 0 #15121a, 0 14px 22px rgba(0, 0, 0, .5);
  transform-origin: 50% 50%; will-change: transform, opacity;
}
.kr { font-family: 'KR', sans-serif; font-weight: 900; }
#speed { position: absolute; left: 0; top: 0; opacity: 0; }
#vignette { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none;
  background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#fade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; opacity: 1; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="wrap">
  <canvas id="speed" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div class="txt" id="t_date_lbl" style="font-size:58px;color:#ffd84a">osu! start</div>
  <div class="txt" id="t_date" style="font-size:132px">2016.11.04</div>
  <div class="txt kr" id="t_kr" style="font-size:72px;color:#9cc4ff;-webkit-text-stroke:14px #15121a">공중참치</div>
  <div class="txt" id="t_title" style="font-size:188px">FlyingTuna</div>
  <div class="txt" id="t_rank_lbl" style="font-size:58px;color:#ffd84a">2017.07.23</div>
  <div class="txt" id="t_rank" style="font-size:150px;color:#ff6fae">#1000</div>
  <div id="fade"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
